<div class="flex flex-1 align-items-center justify-content-center">

    <p-card styleClass="w-full" [style]="{ maxWidth: '32rem' }">

        <div class="flex flex-column align-items-center text-center gap-4">

            <div class="flex align-items-center justify-content-center border-circle bg-orange-100"
                style="width: 5rem; height: 5rem;">

                <i class="pi pi-info-circle text-orange-600 text-4xl"></i>

            </div>


            <div class="flex flex-column gap-2">

                <div class="text-2xl font-bold text-900">
                    Prenotazione già presente
                </div>

                <div class="text-600 line-height-3">
                    Hai già effettuato una prenotazione
                    per questo evento.
                </div>

            </div>


            <p-button label="Torna agli eventi" icon="pi pi-calendar" styleClass="w-full" routerLink="/events" />

        </div>

    </p-card>

</div>
